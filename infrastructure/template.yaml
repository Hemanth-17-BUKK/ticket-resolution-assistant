AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Ticket Resolution Assistant

Resources:

  TicketQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ticket-queue

  AIQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ai-queue

  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: approval-topic-v2

  ApprovalEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: yagateelaharshith@gmail.com
      TopicArn: !Ref ApprovalTopic

  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tickets

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: customerEmail
          AttributeType: S

        - AttributeName: ticketId
          AttributeType: S

        - AttributeName: status
          AttributeType: S

        - AttributeName: priority
          AttributeType: S

        - AttributeName: assignedTeam
          AttributeType: S

      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH

      GlobalSecondaryIndexes:

        - IndexName: email-index
          KeySchema:
            - AttributeName: customerEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: priority-index
          KeySchema:
            - AttributeName: priority
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: assigned-team-index
          KeySchema:
            - AttributeName: assignedTeam
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TicketHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ticket-history

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: historyId
          AttributeType: S

        - AttributeName: ticketId
          AttributeType: S

      KeySchema:
        - AttributeName: historyId
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: ticket-id-index
          KeySchema:
            - AttributeName: ticketId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-attachments'

  KnowledgeBaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-knowledge-base'

  TicketApi:
    Type: AWS::Serverless::Api
    Properties:

      StageName: Prod

      Cors:
        AllowMethods: "'OPTIONS,GET,POST,PUT,DELETE'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'" 

      Auth:

        Authorizers:

          CognitoAuthorizer:

            UserPoolArn: arn:aws:cognito-idp:us-east-1:235951409983:userpool/us-east-1_tYDrYlJBf

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:

      FunctionName: !Sub '${AWS::StackName}-post-confirmation'

      Runtime: nodejs20.x

      CodeUri: ../backend/post-confirmation-service/

      Handler: src/handler.handler

      Policies:

        - Statement:
            Effect: Allow
            Action:
              - cognito-idp:AdminAddUserToGroup
            Resource: "*"

  TicketProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ticket-processor'

      Runtime: nodejs20.x

      CodeUri: ../backend/processor-service/

      Handler: src/handler.handler

      Environment:
        Variables:
          TICKETS_TABLE: !Ref TicketsTable
          HISTORY_TABLE: !Ref TicketHistoryTable
          AI_QUEUE_URL: !Ref AIQueue

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref TicketHistoryTable

        - SQSSendMessagePolicy:
            QueueName: !GetAtt AIQueue.QueueName

      Events:
        TicketQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TicketQueue.Arn
            BatchSize: 1

  AIProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ai-processor'

      Runtime: nodejs20.x

      MemorySize: 512

      Timeout: 60

      CodeUri: ../backend/ai-processor-service/

      Handler: src/handler.handler

      Environment:
        Variables:
          TICKETS_TABLE: !Ref TicketsTable
          KNOWLEDGE_BASE_ID: YIKFHMTQIK
          MODEL_ID: amazon.nova-lite-v1:0
          TOOL_EXECUTOR_FUNCTION: !Ref ToolExecutorFunction
          AGENT_ID: JG8U2S0WKN
          AGENT_ALIAS_ID: TSTALIASID
          ATTACHMENTS_BUCKET: !Ref AttachmentsBucket

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable

        - S3ReadPolicy:
            BucketName: !Ref KnowledgeBaseBucket

        - S3ReadPolicy:
            BucketName: !Ref AttachmentsBucket

        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
                - bedrock:RetrieveAndGenerate
                - bedrock:InvokeModel
              Resource: "*"

        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt ToolExecutorFunction.Arn

        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeAgent
              Resource: "*"

      Events:
        AIQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AIQueue.Arn
            BatchSize: 1

  TicketIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ticket-ingestion'

      Runtime: nodejs20.x

      CodeUri: ../backend/ingestion-service/

      Handler: src/handler.handler

      Environment:
        Variables:
          QUEUE_URL: !Ref TicketQueue
          ATTACHMENTS_BUCKET: !Ref AttachmentsBucket

      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TicketQueue.QueueName

        - S3CrudPolicy:
            BucketName: !Ref AttachmentsBucket

      Events:
        CreateTicket:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  SesIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ses-ingestion'

      Runtime: nodejs20.x

      CodeUri: ../backend/ses-ingestion-service/

      Handler: src/handler.handler

      Environment:
        Variables:
          QUEUE_URL: !Ref TicketQueue
          ATTACHMENTS_BUCKET: !Ref AttachmentsBucket

      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TicketQueue.QueueName

        - S3CrudPolicy:
            BucketName: !Ref AttachmentsBucket

      Events:
        MockEmailApi:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /email
            Method: post

  TicketQueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ticket-query'

      Runtime: nodejs20.x

      MemorySize: 512

      CodeUri: ../backend/query-service/

      Handler: src/handler.handler

      Environment:
        Variables:
          TICKETS_TABLE: !Ref TicketsTable
          HISTORY_TABLE: !Ref TicketHistoryTable
          ATTACHMENTS_BUCKET: !Ref AttachmentsBucket

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref TicketHistoryTable

        - S3ReadPolicy:
            BucketName: !Ref AttachmentsBucket

      Events:
        MyTickets:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /my-tickets
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
            
        GetTicket:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets/{ticketId}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer

        GetDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /dashboard
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer

        GetTicketHistory:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets/{ticketId}/history
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer

        GetAllTickets:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer

        UpdateTicket:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets/{ticketId}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer

        DeleteTicket:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets/{ticketId}
            Method: delete
            Auth:
              Authorizer: CognitoAuthorizer

  ToolExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-tool-executor'

      Runtime: nodejs20.x

      CodeUri: ../backend/tool-executor-service/

      Handler: src/handler.handler

      Environment:
        Variables:
          TICKETS_TABLE: !Ref TicketsTable
          HISTORY_TABLE: !Ref TicketHistoryTable
          APPROVAL_TOPIC_ARN: !Ref ApprovalTopic
          API_BASE_URL: !Sub "https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref TicketHistoryTable

        - SNSPublishMessagePolicy:
            TopicName: approval-topic-v2

  ApprovalHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-approval-handler'

      Runtime: nodejs20.x

      CodeUri: ../backend/approval-handler-service/

      Handler: src/handler.handler

      Environment:
        Variables:
          TICKETS_TABLE: !Ref TicketsTable
          HISTORY_TABLE: !Ref TicketHistoryTable
          MODEL_ID: amazon.nova-lite-v1:0

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref TicketHistoryTable

        - Statement:
            - Effect: Allow
              Action:
                
                 - bedrock:InvokeModel
              Resource: "*"

      Events:
        ApproveTicket:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /approve/{ticketId}
            Method: get

        RejectTicket:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /reject/{ticketId}
            Method: get

Outputs:
  
  ApiGatewayEndpoint:
    Description: API Gateway Endpoint
    Value: !Sub 'https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'

  QueueUrl:
    Description: SQS Queue URL
    Value: !Ref TicketQueue

  AIQueueUrl:
    Description: AI Queue URL
    Value: !Ref AIQueue

  DynamoDBTable:
    Description: DynamoDB Tickets Table
    Value: !Ref TicketsTable

  TicketHistoryTable:
    Description: Ticket History Table
    Value: !Ref TicketHistoryTable

  AttachmentsBucket:
    Description: S3 Attachments Bucket
    Value: !Ref AttachmentsBucket

  KnowledgeBaseBucket:
    Description: Knowledge Base Bucket
    Value: !Ref KnowledgeBaseBucket

  ApprovalTopicArn:
    Description: SNS Approval Topic ARN
    Value: !Ref ApprovalTopic